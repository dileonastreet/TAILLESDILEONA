<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071522">
  <title>محدد المقاس المناسب</title>
  <style>
    :root {
      --bg: #071522;
      --panel: #0c1d2b;
      --panel-2: #0a1926;
      --line: #1e3948;
      --line-bright: #176b68;
      --text: #f1f7fa;
      --muted: #8199a8;
      --teal: #13d1bd;
      --lime: #a6ff35;
      --green: #04c991;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 30px 24px;
      color: var(--text);
      background: radial-gradient(ellipse at 85% 0%, rgba(12, 71, 78, .2), transparent 38%), var(--bg);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }
    .page { width: min(100%, 1120px); margin: 0 auto; }
    .top-line { height: 1px; margin: -30px -24px 27px; background: #17303e; }
    .eyebrow { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; color: #9cb2bf; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .eyebrow-icon { display: grid; width: 20px; height: 20px; place-items: center; border: 1px solid #285361; border-radius: 6px; color: var(--teal); font-size: 12px; }
    .heading-row { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(29px, 5vw, 42px); line-height: 1.2; letter-spacing: -.8px; }
    h1 span { color: var(--lime); }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .live-pill { display: flex; align-items: center; gap: 9px; padding: 9px 14px; border: 1px solid #1d4c4d; border-radius: 999px; color: #bad0d3; background: #0b202b; white-space: nowrap; font-size: 11px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px rgba(4, 201, 145, .7); }
    .panel { padding: 19px; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(120deg, rgba(14, 35, 49, .97), rgba(10, 27, 41, .97)); box-shadow: 0 16px 40px rgba(0, 0, 0, .12); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 15px; }
    .section-title { display: flex; align-items: center; gap: 11px; }
    .section-icon { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #1a555b; border-radius: 10px; color: var(--teal); background: #0d303b; font-size: 16px; }
    .section-title strong { display: block; font-size: 14px; }
    .section-title small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .meta-pill { padding: 8px 12px; border: 1px solid #1e3b49; border-radius: 9px; color: #a9bdc8; background: #0b1c29; font-size: 11px; }
    .meta-pill b { color: var(--teal); }
    form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field { min-width: 0; padding: 13px; border: 1px solid #203b4a; border-radius: 12px; background: rgba(7, 21, 34, .52); transition: border-color .2s, box-shadow .2s; }
    .field:focus-within { border-color: #168f88; box-shadow: 0 0 0 3px rgba(19, 209, 189, .07); }
    label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: #c9d7df; font-size: 12px; font-weight: 650; }
    .label-icon { color: var(--teal); font-size: 14px; }
    .input-wrap { display: flex; align-items: center; height: 43px; border: 1px solid #284555; border-radius: 8px; background: #071724; overflow: hidden; }
    input { width: 100%; min-width: 0; height: 100%; padding: 0 12px; border: 0; outline: 0; color: var(--text); background: transparent; font: inherit; font-size: 16px; font-weight: 650; }
    input::placeholder { color: #587080; }
    .unit { height: 100%; display: grid; min-width: 45px; place-items: center; border-right: 1px solid #294352; color: #8ea5b2; background: #0b1e2b; font-size: 11px; }
    button { grid-column: 1 / -1; min-height: 48px; margin-top: 2px; border: 1px solid #2b7759; border-radius: 10px; color: #071822; background: linear-gradient(100deg, #8ce83c, #b5ff42); font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 7px 24px rgba(119, 226, 47, .13); transition: filter .2s, transform .2s; }
    button:hover { filter: brightness(1.07); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .error { display: none; grid-column: 1 / -1; margin: 0; color: #ff9d9d; font-size: 12px; }
    .error.show { display: block; }
    .size-guide { display: flex; align-items: center; gap: 13px; margin-top: 16px; padding: 12px 14px; border: 1px solid #1b3644; border-radius: 11px; color: var(--muted); background: rgba(7, 21, 34, .35); }
    .guide-title { flex: 0 0 auto; margin: 0; color: #b5c7d0; font-size: 11px; font-weight: 700; }
    .sizes { display: flex; flex-wrap: wrap; gap: 7px; }
    .size-chip { padding: 6px 9px; border: 1px solid #24404c; border-radius: 7px; color: #b5c7d0; background: #0c202d; font-size: 11px; }
    .result { display: none; grid-template-columns: minmax(150px, 1.1fr) 1fr 1fr; align-items: center; gap: 16px; margin-top: 13px; padding: 18px 20px; border: 1px solid #137b68; border-radius: 15px; background: linear-gradient(105deg, rgba(0, 89, 65, .57), rgba(8, 45, 48, .94) 54%, rgba(10, 37, 53, .98)); box-shadow: inset 0 1px rgba(137, 255, 182, .08), 0 14px 32px rgba(0, 0, 0, .12); animation: appear .25s ease-out; }
    .result.show { display: grid; }
    .result-main { display: flex; align-items: center; gap: 14px; }
    .tag-icon { width: 48px; height: 48px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid rgba(67, 226, 154, .36); border-radius: 50%; color: var(--lime); background: rgba(18, 166, 111, .2); font-size: 23px; }
    .result-caption { color: #bfd8d0; font-size: 11px; font-weight: 700; }
    .size-line { display: flex; align-items: baseline; gap: 9px; margin-top: 1px; }
    .size { color: var(--lime); font-size: 45px; font-weight: 850; line-height: 1.05; letter-spacing: -1px; }
    .size-number { color: #d6e6e9; font-size: 14px; font-weight: 700; }
    .result-stat { min-height: 46px; display: flex; flex-direction: column; justify-content: center; padding-inline-start: 18px; border-inline-start: 1px solid rgba(157, 202, 194, .24); }
    .result-stat span { color: #91b5b3; font-size: 10px; font-weight: 700; }
    .result-stat strong { margin-top: 6px; color: #edf8f5; font-size: 14px; }
    .result-note { color: #d2e6e5; font-size: 12px; line-height: 1.7; }
    @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (min-width: 760px) { form { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) {
      body { padding: 24px 15px; }
      .top-line { margin: -24px -15px 22px; }
      .heading-row { align-items: flex-start; }
      .live-pill { margin-top: 7px; padding: 8px 10px; }
      .panel { padding: 14px; }
      .panel-head { align-items: flex-start; }
      .meta-pill { display: none; }
      .result { grid-template-columns: 1fr 1fr; }
      .result-main { grid-column: 1 / -1; padding-bottom: 12px; border-bottom: 1px solid rgba(157, 202, 194, .2); }
      .result-stat { padding-inline-start: 0; border-inline-start: 0; }
      .result-note { grid-column: 1 / -1; margin: 0; }
    }
    @media (max-width: 430px) {
      body { padding-inline: 12px; }
      .heading-row { display: block; }
      .live-pill { display: inline-flex; margin-top: 14px; }
      form { grid-template-columns: 1fr; }
      button { grid-column: 1; }
      .error { grid-column: 1; }
      .size-guide { align-items: flex-start; flex-direction: column; }
      .result { padding: 15px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top-line"></div>
    <div class="eyebrow"><span class="eyebrow-icon">↗</span><span>دليل اختيار المقاس</span></div>
    <header class="heading-row">
      <div>
        <h1>محدد <span>المقاس المناسب</span></h1>
        <p class="subtitle">أدخل بياناتك، واكتشف المقاس الأقرب لك.</p>
      </div>
      <div class="live-pill"><span class="live-dot"></span>حاسبة المقاس</div>
    </header>

    <section class="panel">
      <div class="panel-head">
        <div class="section-title">
          <div class="section-icon" aria-hidden="true">✳</div>
          <div><strong>بيانات القياس</strong><small>أدخل طولك ووزنك لحساب المقاس</small></div>
        </div>
        <div class="meta-pill"><b>المقاسات المتاحة</b> &nbsp; S إلى XXL</div>
      </div>
      <form id="sizeForm" novalidate>
        <div class="field">
          <label for="height"><span class="label-icon">◇</span> الطول</label>
          <div class="input-wrap"><input id="height" type="number" inputmode="decimal" min="100" max="230" placeholder="مثال: 170" required><span class="unit">سم</span></div>
        </div>
        <div class="field">
          <label for="weight"><span class="label-icon">◖</span> الوزن</label>
          <div class="input-wrap"><input id="weight" type="number" inputmode="decimal" min="25" max="250" placeholder="مثال: 70" required><span class="unit">كغ</span></div>
        </div>
        <button type="submit">احسب المقاس المناسب</button>
        <p class="error" id="error" role="alert"></p>
      </form>
      <div class="size-guide">
        <p class="guide-title">جدول المقاسات</p>
        <div class="sizes" aria-label="المقاسات المتاحة">
          <span class="size-chip">S / 31</span><span class="size-chip">M / 32</span><span class="size-chip">L / 33</span><span class="size-chip">XL / 34</span><span class="size-chip">XXL / 36</span>
        </div>
      </div>
    </section>

    <section class="result" id="result" aria-live="polite">
      <div class="result-main">
        <div class="tag-icon" aria-hidden="true">♧</div>
        <div>
          <div class="result-caption">المقاس المناسب لك</div>
          <div class="size-line"><strong class="size" id="size">M</strong><span class="size-number" id="sizeNumber">مقاس 32</span></div>
        </div>
      </div>
      <div class="result-stat"><span>الطول</span><strong id="resultHeight">170 سم</strong></div>
      <div class="result-stat"><span>الوزن</span><strong id="resultWeight">70 كغ</strong></div>
      <p class="result-note" id="resultNote"></p>
    </section>
  </main>
  <script>
    // حدود BMI تقريبية لتحويل الطول والوزن إلى مقاس؛ يمكن تعديلها حسب جدول المنتج الفعلي.
    const sizes = [
      { label: 'S', number: '31', maxBmi: 20.5 },
      { label: 'M', number: '32', maxBmi: 23.5 },
      { label: 'L', number: '33', maxBmi: 26.5 },
      { label: 'XL', number: '34', maxBmi: 30 },
      { label: 'XXL', number: '36', maxBmi: Infinity }
    ];
    const form = document.getElementById('sizeForm');
    const result = document.getElementById('result');
    const error = document.getElementById('error');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const height = Number(document.getElementById('height').value);
      const weight = Number(document.getElementById('weight').value);
      error.classList.remove('show');
      result.classList.remove('show');

      if (!height || !weight || height < 100 || height > 230 || weight < 25 || weight > 250) {
        error.textContent = 'يرجى إدخال طول بين 100 و230 سم، ووزن بين 25 و250 كغ.';
        error.classList.add('show');
        return;
      }

      const bmi = weight / Math.pow(height / 100, 2);
      const selected = sizes.find(item => bmi <= item.maxBmi);
      document.getElementById('size').textContent = selected.label;
      document.getElementById('sizeNumber').textContent = `مقاس ${selected.number}`;
      document.getElementById('resultHeight').textContent = `${height} سم`;
      document.getElementById('resultWeight').textContent = `${weight} كغ`;
      result.classList.add('show');
    });
  </script>
</body>
</html>
