<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقاس سروال Baggy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #171717;
      background: linear-gradient(135deg, #f5f5f5, #dedede);
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      border: 1px solid #e5e5e5;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.12);
    }

    .tag {
      display: table;
      margin: 0 auto 14px;
      padding: 7px 14px;
      border-radius: 20px;
      background: #ededed;
      color: #404040;
      font-size: 13px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 27px;
    }

    .intro {
      margin: 12px 0 25px;
      color: #737373;
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .input-box {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 14px 14px 58px;
      border: 1px solid #d4d4d4;
      border-radius: 11px;
      background: #fafafa;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #404040;
      box-shadow: 0 0 0 4px rgba(64, 64, 64, 0.1);
    }

    .unit {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #737373;
      font-size: 13px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #171717;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #404040;
      transform: translateY(-1px);
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 13px;
      background: #f1f1f1;
      text-align: center;
      line-height: 1.8;
    }

    .size {
      display: block;
      margin: 5px 0;
      font-size: 30px;
      font-weight: 800;
    }

    .note {
      margin: 20px 0 0;
      padding-top: 16px;
      border-top: 1px solid #ededed;
      color: #737373;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <span class="tag">سروال Baggy</span>
    <h1>اعرف مقاسك المناسب</h1>
    <p class="intro">
      أدخل طولك ووزنك للحصول على مقاس مقترح.
    </p>

    <form id="sizeForm">
      <label for="height">الطول</label>
      <div class="input-box">
        <input id="height" type="number" min="100" max="230"
               placeholder="مثال: 175" required>
        <span class="unit">سم</span>
      </div>

      <label for="weight">الوزن</label>
      <div class="input-box">
        <input id="weight" type="number" min="25" max="250"
               placeholder="مثال: 70" required>
        <span class="unit">كغ</span>
      </div>

      <button type="submit">اعرض المقاس</button>
    </form>

    <div id="result" aria-live="polite"></div>

    <p class="note">
      المقاسات المتوفرة:<br>
      31 / S &nbsp; · &nbsp; 32 / M &nbsp; · &nbsp; 33 / L<br>
      34 / XL &nbsp; · &nbsp; 36 / XXL<br>
      <small>المقاسات رقمية للخصر غالبًا؛ تأكد من قياسات المنتج قبل اعتماد النتائج.</small>
    </p>
  </main>

  <script>
    const form = document.getElementById("sizeForm");
    const result = document.getElementById("result");

    // حدود تقديرية للطول والوزن، وليست جدولًا رسميًا للمنتج.
    const sizes = [
      { label: "31 / S",   minWeight: 40, maxWeight: 54, minHeight: 150, maxHeight: 190 },
      { label: "32 / M",   minWeight: 50, maxWeight: 64, minHeight: 155, maxHeight: 195 },
      { label: "33 / L",   minWeight: 60, maxWeight: 74, minHeight: 160, maxHeight: 200 },
      { label: "34 / XL",  minWeight: 70, maxWeight: 88, minHeight: 160, maxHeight: 205 },
      { label: "36 / XXL", minWeight: 84, maxWeight: 120, minHeight: 160, maxHeight: 210 }
    ];

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const height = Number(document.getElementById("height").value);
      const weight = Number(document.getElementById("weight").value);

      const matchingSizes = sizes.filter(size =>
        weight >= size.minWeight &&
        weight <= size.maxWeight &&
        height >= size.minHeight &&
        height <= size.maxHeight
      );

      // عند تداخل الحدود، نختار أقرب مقاس إلى منتصف نطاق الوزن.
      const recommended = matchingSizes.length
        ? matchingSizes.reduce((best, current) => {
            const midCurrent = (current.minWeight + current.maxWeight) / 2;
            const midBest = (best.minWeight + best.maxWeight) / 2;
            return Math.abs(weight - midCurrent) < Math.abs(weight - midBest)
              ? current
              : best;
          })
        : sizes.reduce((best, current) => {
            const scoreCurrent =
              Math.abs(weight - (current.minWeight + current.maxWeight) / 2) +
              Math.abs(height - (current.minHeight + current.maxHeight) / 2) * 0.25;
            const scoreBest =
              Math.abs(weight - (best.minWeight + best.maxWeight) / 2) +
              Math.abs(height - (best.minHeight + best.maxHeight) / 2) * 0.25;
            return scoreCurrent < scoreBest ? current : best;
          });

      result.style.display = "block";
      result.innerHTML = `
        المقاس المقترح
        <span class="size"><LaTex>{recommended.label}</span>         <span>لطول</LaTex>{height} سم ووزن ${weight} كغ</span>
      `;
    });
  </script>
</body>
</html>
